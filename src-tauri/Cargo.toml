[package]
name = "pretty-latex"
version = "0.1.0"
description = "A minimal LaTeX editor with a glass, terminal-like feel"
authors = ["Paulo Akira"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows cargo quirk).
name = "pretty_latex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: needed for a transparent window, which the glass design relies on
# (docs/DECISIONS.md, D1).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

# Terminal-style background blur needs one Objective-C call on the NSWindow.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Stopping a stale build signals latexmk's whole process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
